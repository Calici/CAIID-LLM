[project]
name = "chat-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Jonathan Willianto",email = "jowillianto@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard] (>=0.117.1,<0.118.0)",
    "psycopg-binary (>=3.2.10,<4.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "uvicorn (>=0.36.0,<0.37.0)",
    "pydantic-ai-slim[openai] (>=1.0.10,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
